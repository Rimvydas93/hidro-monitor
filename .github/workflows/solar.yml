name: Solar park watchdog
on:
  schedule:
    - cron: "17 * * * *"          # safety net: restarts the loop if it ever stopped
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test Telegram message"
        type: boolean
        default: false
      daily:
        description: "Send the daily league table now"
        type: boolean
        default: false
      probe:
        description: "Dump FIMER inverter page fields to fimer_probe.txt (no Telegram)"
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: solar-${{ (inputs.daily || inputs.test || inputs.probe) && 'manual' || 'loop' }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run
        env:
          FIMER_USER: ${{ secrets.FIMER_USER }}
          FIMER_PASSWORD: ${{ secrets.FIMER_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IGNORE_INVERTERS: "111747"
          PRICE_THRESHOLD: "19"
          ARGS: ${{ (inputs.daily && '--daily') || (inputs.test && '--test') || (inputs.probe && '--probe') || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "solar-watchdog"
          git config user.email "actions@github.com"
          # sync_code: successors are queued at the start of the previous run, so checkout gave them a stale commit
          sync_code() { git fetch -q --depth=1 origin main && git reset -q --hard FETCH_HEAD || true; }
          # save: never rebase. Move HEAD to the newest origin/main (worktree untouched), commit only our own files, push; retry on races
          save() {
            for i in 1 2 3; do
              if git fetch -q --depth=1 origin main && git reset -q FETCH_HEAD; then
                for f in solar_state.json solar_daily_done.txt held_solar.json fimer_probe.txt; do
                  if [ -e "$f" ] || git ls-files --error-unmatch "$f" >/dev/null 2>&1; then git add -A -- "$f"; fi
                done
                if git diff --cached --quiet; then return 0; fi
                if git commit -q -m state && git push -q origin HEAD:main; then return 0; fi
              fi
              sleep $((i * 7))
            done
            echo "save failed after 3 tries"
            return 0
          }
          quiet_ok() { h=$(TZ=Europe/Vilnius date +%-H); [ "$h" -ge 7 ] && [ "$h" -lt 21 ]; }
          watch() {
            alive=$(gh run list --workflow=hidro-monitor.yml --json status -q '[.[] | select(.status != "completed")] | length' 2>/dev/null || echo "?")
            if [ "$alive" = "0" ]; then
              gh workflow run hidro-monitor.yml || true
              if quiet_ok; then curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=⚠️ Hidro monitor (Rakiškės HE) had stopped - it was restarted automatically." > /dev/null || true; fi
            fi
          }
          sync_code
          if [ -n "$ARGS" ]; then
            python solar_monitor.py $ARGS || true
            save
            exit 0
          fi
          # loop mode: queue the successor now (it waits for this run to end), then check every 10 min
          gh workflow run solar.yml || true
          trap 'save; exit 0' INT TERM   # a cancel/restart keeps the latest state
          end=$(( $(date +%s) + 20400 ))
          n=0
          while [ "$(date +%s)" -lt "$end" ]; do
            python solar_monitor.py || echo "check failed"
            n=$((n+1))
            if [ $((n % 6)) -eq 0 ]; then save; fi
            if [ $((n % 3)) -eq 0 ]; then watch; fi
            sleep 600 & wait $!
          done
          save
