name: Solar park watchdog
on:
  schedule:
    - cron: "17 * * * *"          # safety net: restarts the loop if it ever stopped
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test Telegram message"
        type: boolean
        default: false
      daily:
        description: "Send the daily league table now"
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: solar-${{ (inputs.daily || inputs.test) && 'manual' || 'loop' }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run
        env:
          FIMER_USER: ${{ secrets.FIMER_USER }}
          FIMER_PASSWORD: ${{ secrets.FIMER_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IGNORE_INVERTERS: "111747"
          PRICE_THRESHOLD: "19"
          ARGS: ${{ (inputs.daily && '--daily') || (inputs.test && '--test') || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "solar-watchdog"
          git config user.email "actions@github.com"
          save() {
            git add solar_state.json solar_daily_done.txt 2>/dev/null || true
            git diff --cached --quiet || (git commit -m "state" -q && git pull --rebase -q && git push -q) || true
          }
          watch() {
            alive=$(gh run list --workflow=hidro-monitor.yml --json status -q '[.[] | select(.status != "completed")] | length' 2>/dev/null || echo "?")
            if [ "$alive" = "0" ]; then
              gh workflow run hidro-monitor.yml || true
              curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=⚠️ Hidro monitor (Rakiškės HE) had stopped - it was restarted automatically." > /dev/null || true
            fi
          }
          if [ -n "$ARGS" ]; then
            python solar_monitor.py $ARGS || true
            save
            exit 0
          fi
          # loop mode: queue the successor now (it waits for this run to end), then check every 10 min
          gh workflow run solar.yml || true
          end=$(( $(date +%s) + 20400 ))
          n=0
          while [ "$(date +%s)" -lt "$end" ]; do
            python solar_monitor.py || echo "check failed"
            t=$(date -u +%-H%M); today=$(date -u +%F)
            if [ "$t" -ge 1805 ] && [ "$t" -lt 1900 ] && [ "$(cat solar_daily_done.txt 2>/dev/null)" != "$today" ]; then
              python solar_monitor.py --daily || echo "daily failed"
              echo "$today" > solar_daily_done.txt
            fi
            n=$((n+1))
            if [ $((n % 6)) -eq 0 ]; then save; fi
            if [ $((n % 3)) -eq 0 ]; then watch; fi
            sleep 600
          done
          save
