name: Hidro monitor
on:
  schedule:
    - cron: "23 * * * *"          # safety net: restarts the loop if it ever stopped
  workflow_dispatch:
    inputs:
      mode:
        description: loop (default), check or summary
        default: loop
permissions:
  contents: write
  actions: write
concurrency:
  group: hidro-${{ (github.event.inputs.mode == 'check' || github.event.inputs.mode == 'summary') && 'manual' || 'loop' }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ github.event.inputs.mode || 'loop' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "hidro-monitor"
          git config user.email "hidro-monitor@users.noreply.github.com"
          # sync_code: successors are queued at the start of the previous run, so checkout gave them a stale commit
          sync_code() { git fetch -q --depth=1 origin main && git reset -q --hard FETCH_HEAD || true; }
          # save: never rebase. Move HEAD to the newest origin/main (worktree untouched), commit only our own files, push; retry on races
          save() {
            date -u +%FT%TZ > hidro_heartbeat.txt
            for i in 1 2 3; do
              if git fetch -q --depth=1 origin main && git reset -q FETCH_HEAD; then
                for f in state.json hidro_daily_done.txt hidro_heartbeat.txt held_hidro.json; do
                  if [ -e "$f" ] || git ls-files --error-unmatch "$f" >/dev/null 2>&1; then git add -A -- "$f"; fi
                done
                if git diff --cached --quiet; then return 0; fi
                if git commit -q -m state && git push -q origin HEAD:main; then return 0; fi
              fi
              sleep $((i * 7))
            done
            echo "save failed after 3 tries"
            return 0
          }
          quiet_ok() { h=$(TZ=Europe/Vilnius date +%-H); [ "$h" -ge 7 ] && [ "$h" -lt 21 ]; }
          watch() {
            alive=$(gh run list --workflow=solar.yml --json status -q '[.[] | select(.status != "completed")] | length' 2>/dev/null || echo "?")
            if [ "$alive" = "0" ]; then
              gh workflow run solar.yml || true
              if quiet_ok; then curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=⚠️ Solar park watchdog had stopped - it was restarted automatically." > /dev/null || true; fi
            fi
          }
          sync_code
          if [ "$MODE" != "loop" ]; then
            python monitor.py "$MODE" || true
            save
            exit 0
          fi
          # loop mode: queue the successor now (it waits for this run to end), then check every 5 min
          gh workflow run hidro-monitor.yml || true
          trap 'save; exit 0' INT TERM   # a cancel/restart keeps the latest state
          end=$(( $(date +%s) + 20400 ))
          n=0
          while [ "$(date +%s)" -lt "$end" ]; do
            python monitor.py check || echo "check failed"
            t=$(date -u +%-H%M); today=$(date -u +%F)
            if [ "$t" -ge 500 ] && [ "$t" -lt 600 ] && [ "$(cat hidro_daily_done.txt 2>/dev/null)" != "$today" ]; then
              python monitor.py summary || echo "summary failed"
              echo "$today" > hidro_daily_done.txt
            fi
            n=$((n+1))
            if [ $((n % 12)) -eq 0 ]; then save; fi
            if [ $((n % 6)) -eq 0 ]; then watch; fi
            sleep 300 & wait $!
          done
          save
